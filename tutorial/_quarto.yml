project:
  type: book
  output-dir: _book
  pre-render:
    - Rscript _pre-render.R

book:
  title: "sconjoint: Structural Random-Utility Estimation for Conjoint Experiments"
  author:
    - Avidit Acharya
    - Jens Hainmueller
    - Yiqing Xu
  chapters:
    - index.qmd
    - 01-installation.qmd
    - 02-quickstart.qmd
    - 03-gs.qmd
    - 04-br.qmd
    - 05-quantities.qmd
    - 05b-plots.qmd
    - 06-inference.qmd
    - 07-respondents.qmd
    - references.qmd
    - changelog.qmd

bibliography: references.bib
link-citations: true

format:
  html:
    theme: cosmo
    toc: true
    code-overflow: wrap
    fig-format: png
    fig-dpi: 150

execute:
  freeze: false
  cache: true
  eval: true
  echo: true
  warning: true
  message: false
